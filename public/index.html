<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeCoding - 프로젝트 관리 플랫폼</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            max-width: 1000px;
            padding: 2rem;
        }
        h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            font-weight: 300;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 3rem;
            opacity: 0.9;
        }
        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .menu-item {
            display: block;
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            padding: 2rem;
            border-radius: 15px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .menu-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }
        .menu-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .menu-desc {
            font-size: 1rem;
            opacity: 0.8;
            line-height: 1.4;
        }
        .primary {
            border: 2px solid #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }
        .footer {
            margin-top: 3rem;
            opacity: 0.7;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>VibeCoding</h1>
        <p class="subtitle">코딩 프로젝트를 체계적으로 관리하고 시작하는 플랫폼</p>
        
        <div class="menu">
            <a href="/req" class="menu-item primary">
                <span class="menu-icon">📋</span>
                <div class="menu-title">요구사항 관리</div>
                <div class="menu-desc">프로젝트 시작의 첫 단계, 요구사항을 정의하고 관리하세요</div>
            </a>
            
            <a href="/research" class="menu-item">
                <span class="menu-icon">📊</span>
                <div class="menu-title">시장조사 & PRD</div>
                <div class="menu-desc">시장 분석과 제품 요구사항 문서를 작성하고 관리하세요</div>
            </a>
            
            <a href="/progress" class="menu-item">
                <span class="menu-icon">📈</span>
                <div class="menu-title">진척사항 관리</div>
                <div class="menu-desc">과제별 진행 상황을 추적하고 일정을 관리하세요</div>
            </a>
            
            <a href="/deliverables" class="menu-item">
                <span class="menu-icon">🎨</span>
                <div class="menu-title">산출물 관리</div>
                <div class="menu-desc">디자인, 문서, 코드 등 프로젝트 산출물을 관리하세요</div>
            </a>
            
            <a href="/agile-launch" class="menu-item primary">
                <span class="menu-icon">🚀</span>
                <div class="menu-title">Agile Launch Service</div>
                <div class="menu-desc">AI와 함께 애자일하게 아이디어를 실제 서비스로 발전시키세요</div>
            </a>
        </div>
        
        <div class="footer">
            <p>체계적인 프로젝트 관리로 성공적인 코딩 프로젝트를 시작하세요 🚀</p>
        </div>
    </div>
</body>
</html>
